# Toda terça: gera o rascunho do "caso da semana" com IA e abre um Pull Request para revisão humana.
# Requer: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Repositório novo sem nenhuma execução agendada? Um commit que altere este arquivo registra o cron de novo.
name: learning-draft

on:
  schedule:
    - cron: "41 12 * * 2"   # terça, 12:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: vars.PIPELINE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: gen
        run: |
          python -m cyberradar learning-draft | tee out.txt
          if grep -q "Rascunho gerado" out.txt; then echo "created=true" >> "$GITHUB_OUTPUT"; fi
      - name: Abrir Pull Request para revisão
        if: steps.gen.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          week=$(date -u +%G-W%V)
          branch="aprendizado/caso-$week"
          git config user.name "cyberradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/learning
          git commit -m "aprendizado: rascunho do caso da semana $week"
          git push -u origin "$branch"
          gh pr create --title "Caso da semana $week (rascunho para revisão)" --body "Rascunho gerado por IA a partir da vulnerabilidade mais relevante da semana.

          Checklist de revisão:
          - [ ] Gabaritos corretos e inequívocos
          - [ ] Distratores plausíveis
          - [ ] Explicações corretas e sem passo a passo de ataque
          - [ ] Nenhuma questão copiada de prova real
          - [ ] Trocar \`status\` de \`in_review\` para \`published\` nos itens aprovados (ou apagar os ruins)

          Itens com status diferente de \`published\` não aparecem no site."
