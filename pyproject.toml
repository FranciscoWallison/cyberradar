[project]
name = "cyberradar"
version = "0.1.0"
description = "Radar de vulnerabilidades e ameaças em português — pipeline estático de custo zero."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<0.29",
  "feedparser>=6.0.11,<7",
  "jinja2>=3.1.4,<4",
  "markdown>=3.7,<4",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pagefind[extended]>=1.3,<2"]

[tool.setuptools.packages.find]
include = ["cyberradar*"]

[tool.setuptools.package-data]
cyberradar = ["site/templates/*.html", "site/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
